<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Web Apps Lab 3</title>
	<style>
		body{border:1px solid gray;}
	</style>
</head>
<body>
<h1>My Favorites</h1>
<h2>My Favorite Colors</h2>

<ol id="colorsList">
	
</ol>

<h2>My Favorite Foods</h2>

<ol id="foodsList">
	
</ol>

<h2>My Favorite Links</h2>

<ol id="linksList">
	
</ol>

<script>
"use strict";
let colors = ["red","green","blue","purple","pink"];
let foods = ["pizza","spaghetti","chicken","mozzerella"]; // add some foods

// Optional - can you figure out how to pull both the key AND the value
// from the `links` object literal?
let links = {
		"RIT": "http://www.rit.edu",
		"RWAG" : "https://www.facebook.com/RWAGclub",
		"New Media Club" : "http://newmediaclub.cias.rit.edu"
	}

let colorList = document.getElementById("colorsList");
for (let i = 0; i < colors.length; i++)
{
	let newElement = document.createElement("li");
	newElement.innerHTML = colors[i];
	colorList.appendChild(newElement);
}

let foodsList = document.getElementById("foodsList");
for (let food of foods)
{
	let newElement = document.createElement("li");
	newElement.innerHTML = food;
	foodsList.appendChild(newElement);
}

</script>
</body>
</html>

<html lang="en">
<head>

  <script type="module">

// TODO: ADD YOUR imports and Firebase setup code HERE

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, set, push, onValue, increment } from  "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
const firebaseConfig = {
    apiKey: "AIzaSyDnNY2a2pIRtCn2FuHP0z4HSVfx0dWaAUI",
    authDomain: "high-scores-bebc8.firebaseapp.com",
    projectId: "high-scores-bebc8",
    storageBucket: "high-scores-bebc8.appspot.com",
    messagingSenderId: "1021254562545",
    appId: "1:1021254562545:web:7afd46269f5eb152252f50"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
console.log(app); // make sure firebase is loaded

const favoritesChanged = (snapshot) => {
  // Clear #favoritesList
  favoritesList.innerHTML = "";
  snapshot.forEach(fav => {
    const childKey = fav.key;
    const childData = fav.val();
    console.log(childKey,childData);

    // Only show parks with > 0 likes
    if (childData.likes > 0) 
      favoritesList.innerHTML += `<li><b>${childData.parkName}</b> - Likes: ${childData.likes}</li>`;
  });
};

const init = () => {
  const db = getDatabase();
  const favoritesRef = ref(db, 'favoriteParks/');
  onValue(favoritesRef,favoritesChanged);
};

init();

</script>
</head>
<body>
<header class="hero is-info is-bold p-2">

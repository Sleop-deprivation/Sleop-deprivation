<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Firebase Admin</title>
</head>
<body>
<h1>High Scores</h1>
<ul id="scoresList"><li>No data yet!</li></ul>

<script type="module">
    /* #1 - The Firebase setup code goes here  - both imports, `firebaseConfig` and `app` */
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getDatabase, ref, set, push, onValue } from  "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
    // TODO: Add SDKs for Firebase products that you want to use
    // https://firebase.google.com/docs/web/setup#available-libraries

    // Your web app's Firebase configuration
    const firebaseConfig = {
        apiKey: "AIzaSyDnNY2a2pIRtCn2FuHP0z4HSVfx0dWaAUI",
        authDomain: "high-scores-bebc8.firebaseapp.com",
        projectId: "high-scores-bebc8",
        storageBucket: "high-scores-bebc8.appspot.com",
        messagingSenderId: "1021254562545",
        appId: "1:1021254562545:web:7afd46269f5eb152252f50"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    console.log(app); // make sure firebase is loaded
	
	
	
    // #2 NEW STUFF
    const db = getDatabase();
    const scoresRef = ref(db, 'scores');

    const scoresChanged = (snapshot) => {
        scoresList.innerHTML = "";
        snapshot.forEach(score => {
            const childKey = score.key;
            const childData = score.val();
            console.log(childKey,childData);
            scoresList.innerHTML += `<li>${childData.userId} - ${childData.game} - ${childData.score}</li>`;
        });
    }

    onValue(scoresRef,scoresChanged);
	
</script>
</body>
</html>

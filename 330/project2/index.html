<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Audio Visualizer</title>
  <link href="./styles/default-styles.css" type="text/css" rel="stylesheet" />
  <script src="./src/loader.js" type="module"></script>
</head>
<body>
<main>
  <canvas width="800" height="400"></canvas>
  <div id="controls">
    <section>
      <button id="button-play" data-playing="no"></button>
      <button id="button-fs">Full Screen</button>
		
      <label>Track: 
        <select id="track-select"></select>
      </label>
    </section>
		
    <section>
      Volume: <input type="range" id="slider-volume" min="0" max="2" value="1" step="0.01">
      <span id="volume-label">???</span>
      <span><input type="checkbox" id="cb-bass" checked="true"><label for="cb-bass">Increase Bass</label></span>
      <span><input type="checkbox" id="cb-treble" checked="true"><label for="cb-treble">Increase Treble</label></span>
    </section>

    <section>
      <span>
        <label for="select-datatype">Data Type:</label>
        <select name="datatype" id="select-datatype">
          <option value="frequency">Frequency Data</option>
          <option value="frequency">Time Domain Data</option>
        </select>
      </span>
      <span><input type="checkbox" id="cb-gradient"><label for="cb-gradient">Show Gradient</label></span>
      <span><input type="checkbox" id="cb-moon"><label for="cb-moon">Show Moon</label></span>
      <span><input type="checkbox" id="cb-stars"><label for="cb-stars">Show Stars</label></span>
      <span><input type="checkbox" id="cb-bars"><label for="cb-bars">Show Bars</label></span>
      <span><input type="checkbox" id="cb-invert"><label for="cb-invert">Invert Colors</label></span>
      <span><input type="checkbox" id="cb-emboss"><label for="cb-emboss">Emboss Colors</label></span>
    </section>
  </div>
</main>
</body>
</html>
